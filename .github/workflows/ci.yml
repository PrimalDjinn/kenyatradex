name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.6.0"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
  NUXT_PUBLIC_SITE_URL: https://kenyatradex.africa
  NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ci-recaptcha-site-key
  NUXT_RECAPTCHA_SECRET: ci-recaptcha-secret
  NUXT_FORM_RECIPIENT: info@kenyatradex.africa
  NUXT_ADMIN_EMAIL: admin@kenyatradex.africa
  NUXT_ADMIN_PASSWORD: ci-admin-password
  NUXT_ADMIN_SESSION_SECRET: ci-admin-session-secret
  STUDIO_SSO_URL: https://kenyatradex.africa
  STUDIO_SSO_CLIENT_ID: kenyatradex-studio
  STUDIO_SSO_CLIENT_SECRET: ci-admin-session-secret
  STUDIO_REPOSITORY_OWNER: PrimalDjinn
  STUDIO_REPOSITORY_REPO: kenyatradex
  STUDIO_REPOSITORY_BRANCH: main
  DATABASE_URL: postgres://kenyatradex:kenyatradex@localhost:5432/kenyatradex

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kenyatradex
          POSTGRES_PASSWORD: kenyatradex
          POSTGRES_DB: kenyatradex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kenyatradex -d kenyatradex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Capture commit author
        id: commit
        run: |
          {
            echo "author_name=$(git log -1 --format='%an')"
            echo "author_email=$(git log -1 --format='%ae')"
            echo "message<<EOF"
            git log -1 --format='%B'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Email workflow start
        continue-on-error: true
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          NOTIFY_EMAILS: ${{ vars.NOTIFY_EMAILS }}
          AUTHOR_NAME: ${{ steps.commit.outputs.author_name }}
          AUTHOR_EMAIL: ${{ steps.commit.outputs.author_email }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_STATUS: started
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SITE_URL: https://kenyatradex.africa
        run: python .github/scripts/send_workflow_email.py

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm --version

      - name: Install dependencies
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/failed-step-logs"
          log="$RUNNER_TEMP/install-dependencies.log"

          CI=true pnpm install --frozen-lockfile 2>&1 | tee "$log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp "$log" "$RUNNER_TEMP/failed-step-logs/install-dependencies.log"
          fi
          exit "$status"

      - name: Lint
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/failed-step-logs"
          log="$RUNNER_TEMP/lint.log"

          pnpm exec eslint . 2>&1 | tee "$log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp "$log" "$RUNNER_TEMP/failed-step-logs/lint.log"
          fi
          exit "$status"

      - name: Typecheck
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/failed-step-logs"
          log="$RUNNER_TEMP/typecheck.log"

          pnpm exec nuxi typecheck 2>&1 | tee "$log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp "$log" "$RUNNER_TEMP/failed-step-logs/typecheck.log"
          fi
          exit "$status"

      - name: Route parity
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/failed-step-logs"
          log="$RUNNER_TEMP/route-parity.log"

          pnpm run validate:routes 2>&1 | tee "$log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp "$log" "$RUNNER_TEMP/failed-step-logs/route-parity.log"
          fi
          exit "$status"

      - name: Build Nuxt
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/failed-step-logs"
          log="$RUNNER_TEMP/build-nuxt.log"

          pnpm run build 2>&1 | tee "$log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp "$log" "$RUNNER_TEMP/failed-step-logs/build-nuxt.log"
          fi
          exit "$status"

      - name: Docker build smoke test
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/failed-step-logs"
          log="$RUNNER_TEMP/docker-build.log"

          docker build --build-arg NODE_VERSION=24-bookworm-slim -t kenyatradex:${GITHUB_SHA} . 2>&1 | tee "$log"

          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            cp "$log" "$RUNNER_TEMP/failed-step-logs/docker-build.log"
          fi
          exit "$status"

      - name: Email workflow result
        if: always()
        continue-on-error: true
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          NOTIFY_EMAILS: ${{ vars.NOTIFY_EMAILS }}
          AUTHOR_NAME: ${{ steps.commit.outputs.author_name }}
          AUTHOR_EMAIL: ${{ steps.commit.outputs.author_email }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILURE_LOG_DIR: ${{ runner.temp }}/failed-step-logs
          SITE_URL: https://kenyatradex.africa
        run: python .github/scripts/send_workflow_email.py
